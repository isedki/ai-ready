# Projet Xcode généré par XcodeGen (`xcodegen` dans ce dossier).
# CI : .github/workflows/ios-ci.yml (tests + build + test de bout en bout) et ios-testflight.yml (TestFlight).
name: Reunions
options:
  bundleIdPrefix: com.issamsedki
  deploymentTarget:
    iOS: "17.0"
packages:
  ReunionsCore:
    path: Packages/ReunionsCore
  ReunionsEngine:
    path: Packages/ReunionsEngine
targets:
  Reunions:
    type: application
    platform: iOS
    sources: [App]
    dependencies:
      - package: ReunionsCore
        product: ReunionsCore
      - package: ReunionsEngine
        product: ReunionsEngine
    scheme: {}
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Réunions
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSMicrophoneUsageDescription: Enregistrer les réunions pour en préparer le compte rendu.
        UIBackgroundModes: [audio]
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.issamsedki.reunions
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
