# Projet Xcode généré par XcodeGen (`xcodegen` dans ce dossier).
# Construit et publié sur TestFlight par .github/workflows/ios-testflight.yml : aucun Mac nécessaire.
name: Reunions
options:
  bundleIdPrefix: com.issamsedki
  deploymentTarget:
    iOS: "17.0"
packages:
  argmax-oss-swift:
    url: https://github.com/argmaxinc/argmax-oss-swift
    from: 1.0.0
targets:
  Reunions:
    type: application
    platform: iOS
    sources: [Sources]
    dependencies:
      - package: argmax-oss-swift
        product: WhisperKit
    scheme: {}
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: Réunions
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSMicrophoneUsageDescription: Enregistrer les réunions pour en préparer le compte rendu.
        UIBackgroundModes: [audio]
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.issamsedki.reunions
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
