# CI de l'app iOS « Réunions » (aucun secret nécessaire) :
#  1. tests unitaires de ReunionsCore (glossaire, corrections, export, découpage audio, stockage) ;
#  2. compilation de l'app pour iPhone (simulateur, sans signature) ;
#  3. test de bout en bout : vraie transcription Whisper d'une réunion synthétique darija/français + jargon Phénix.
name: iOS CI

on:
  workflow_dispatch:
  push:
    paths:
      - 'ios/Reunions/**'
      - '.github/workflows/ios-ci.yml'

concurrency:
  group: ios-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-tests:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Tests unitaires ReunionsCore
        run: swift test --package-path ios/Reunions/Packages/ReunionsCore

  app-build:
    runs-on: macos-15
    timeout-minutes: 45
    defaults:
      run:
        working-directory: ios/Reunions
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Générer le projet
        run: |
          brew install xcodegen
          xcodegen
      - name: Compiler l'app (iPhone, simulateur)
        run: |
          set -o pipefail
          xcodebuild build \
            -project Reunions.xcodeproj -scheme Reunions -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO | tail -n 80

  e2e:
    runs-on: macos-15
    timeout-minutes: 60
    defaults:
      run:
        working-directory: ios/Reunions
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Cache du modèle Whisper
        uses: actions/cache@v4
        with:
          path: ~/Documents/huggingface
          key: whisperkit-large-v3-v20240930_626MB
      - name: Compiler reunions-cli (moteur de l'app)
        run: swift build -c release --package-path Packages/ReunionsEngine --product reunions-cli
      - name: Transcrire la réunion de test et vérifier
        run: |
          chmod +x E2E/run.sh
          E2E/run.sh "$(swift build -c release --package-path Packages/ReunionsEngine --show-bin-path)/reunions-cli"
      - name: Garder l'audio et la transcription
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-transcription
          path: ios/Reunions/E2E/out/
          if-no-files-found: ignore
